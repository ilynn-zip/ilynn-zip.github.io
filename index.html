<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nothing Here Yet</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232A2A36'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='%23f5c542' font-family='sans-serif'%3E⚠️%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="bg-canvas"></div>

    <div class="tape-back" id="tapeBack">
        <div class="crime-tape" style="top:-8%; transform:rotate(-18deg) scale(0.9); height:30px;"></div>
        <div class="crime-tape" style="top:12%; transform:rotate(35deg) scale(1.1); height:34px;"></div>
        <div class="crime-tape" style="top:32%; transform:rotate(-48deg) scale(0.8); height:24px;"></div>
        <div class="crime-tape" style="top:52%; transform:rotate(62deg) scale(1.0); height:32px;"></div>
        <div class="crime-tape" style="top:72%; transform:rotate(-38deg) scale(0.9); height:28px;"></div>
        <div class="crime-tape" style="top:94%; transform:rotate(25deg) scale(0.85); height:26px;"></div>
    </div>

    <div class="tape-front" id="tapeFront">
        <div class="crime-tape" style="top:66%; transform:rotate(-10deg) scale(0.9); height:28px;"></div>
        <div class="crime-tape" style="top:110%; transform:rotate(58deg) scale(0.85); height:26px;"></div>
    </div>

    <div class="glass-card" role="main" aria-label="Under Construction">
        <span class="icon" aria-hidden="true">⚠️</span>
        <h1>Nothing Here Yet</h1>
        <div class="loader-tape" aria-label="Loading indicator"></div>
        <span class="status">Coming Soon</span>
        <span class="sub">maintenance in progress</span>
    </div>

    <footer class="copyright">
        &copy; <span id="year"></span> Ilynn. All rights reserved.
    </footer>

    <script src="script.js"></script>
</body>

</html>
