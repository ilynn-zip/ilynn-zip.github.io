<!DOCTYPE html>
<html lang="ru" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Все проекты</title>
  <link rel="icon" type="image/svg+xml" href="/assets/ilynn.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <script src="/js/supabase-js.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/content.js"></script>
  <script src="/js/projects-render.js"></script>
  <script src="/js/script.js" defer></script>
</head>

<body>

  <div class="bg-decor" aria-hidden="true">
    <div class="bg-decor__base"></div>
    <div class="bg-decor__film"></div>
  </div>

  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader__mark">
      <span></span><span></span><span></span>
    </div>
  </div>

  <header class="topnav">
    <div class="topnav__brand">
      <span class="glyph"></span>
      <span class="txt" data-content="nav.brand">Ilynn</span>
    </div>
    <div class="topnav__rail topnav__rail--center">
      <a class="back-link" href="/" aria-label="Назад">
        <span class="back-link__inner">
          <span class="back-link__diamond"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
          <span data-content="catalog.back">Назад</span>
        </span>
      </a>
    </div>
    <div class="topnav__right">
      <div class="topnav__status">
        <span class="dot"></span>
        <span class="txt" id="projectsTotalTop">—</span>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
      </button>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button class="lang-toggle__btn" type="button" data-lang="ru" aria-pressed="false">RU</button>
        <button class="lang-toggle__btn" type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="page__inner">

      <div class="proj-hero">
        <div class="proj-hero__meta">
          <span data-content="catalog.meta.left">Каталог</span>
          <span id="catalogMetaRight"></span>
        </div>
        <h1 class="proj-hero__title" data-content-html="catalog.title">Все <em data-text="проекты">проекты</em></h1>
        <p class="proj-hero__lede" data-content-html="catalog.lede">Здесь то, что доделал до конца, <b>ну почти...</b>
        </p>
      </div>

      <div class="projects-grid" id="projectsGrid"></div>

      <div class="proj-footer">
        <span data-content-html="footer.copyright">© 2026 · <b>Ilynn</b></span>
        <span data-content-html="footer.location">Москва · <span class="accent">UTC+3</span></span>
        <span data-content="footer.note">Meh, good enough</span>
      </div>

    </div>
  </main>

  <span class="panel__wm panel__wm--fixed" data-wm aria-hidden="true">Projects</span>

  <script>
    (function () {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initProjectsPage);
      } else {
        initProjectsPage();
      }
    })();
  </script>

</body>

</html>
